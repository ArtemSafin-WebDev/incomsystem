<div class="feedback-modal feedback-modal--product-cart js-feedback-modal" id="{{modal.id}}" aria-hidden="true" inert>
    <button type="button" class="feedback-modal__backdrop js-feedback-modal-close"
        aria-label="{{modal.closeAriaLabel}}"></button>

    <div class="feedback-modal__dialog product-cart-modal__dialog" role="dialog" aria-modal="true"
        aria-labelledby="{{modal.id}}-title">
        <picture class="feedback-modal__bg-picture">
            <img class="feedback-modal__bg product-cart-modal__bg" src="{{modal.background}}" alt="">
        </picture>

        <button type="button" class="feedback-modal__close js-feedback-modal-close" data-modal-initial-focus
            aria-label="{{modal.closeAriaLabel}}">
            <svg width="15" height="15" aria-hidden="true">
                <use xlink:href="#close"></use>
            </svg>
        </button>

        <div class="feedback-modal__content product-cart-modal__content">
            <div class="feedback-modal__head product-cart-modal__head">
                <h2 class="feedback-modal__title" id="{{modal.id}}-title">{{{modal.title}}}</h2>
                <p class="feedback-modal__description">{{modal.description}}</p>
            </div>

            <form class="contact-us__form product-cart-modal__form js-form"
                action="{{modal.formAction}}"
                data-success-modal="#feedback-success-modal"
                method="post"
                enctype="multipart/form-data">
                <div class="product-cart-modal__products">
                    <ul class="product-cart-modal__list">
                        {{#each modal.products}}
                        <li class="product-cart-modal__product">
                            <p class="product-cart-modal__product-title">{{this.title}}</p>

                            <div class="product-cart-modal__product-actions">
                                <div class="product-cart-modal__quantity">
                                    <button class="product-cart-modal__round-button" type="button"
                                        aria-label="{{this.decreaseLabel}}" data-cart-action="decrease"
                                        data-product-id="{{this.id}}">−</button>
                                    <input class="product-cart-modal__quantity-input" type="number"
                                        name="products[{{@index}}][quantity]" min="1" value="{{this.quantity}}"
                                        aria-label="Количество товара {{this.title}}">
                                    <button class="product-cart-modal__round-button" type="button"
                                        aria-label="{{this.increaseLabel}}" data-cart-action="increase"
                                        data-product-id="{{this.id}}">+</button>
                                </div>

                                <img class="product-cart-modal__product-image" src="{{this.image}}" alt="{{this.imageAlt}}">

                                <button class="product-cart-modal__round-button product-cart-modal__delete" type="button"
                                    aria-label="{{this.deleteLabel}}" data-cart-action="delete"
                                    data-product-id="{{this.id}}">
                                    <svg width="24" height="24" aria-hidden="true">
                                        <use xlink:href="#trash"></use>
                                    </svg>
                                </button>
                            </div>
                        </li>
                        {{/each}}
                    </ul>

                    <button class="product-cart-modal__delete-all" type="button" data-cart-action="delete-all">
                        <span>{{modal.deleteAllText}}</span>
                        <span class="product-cart-modal__round-button" aria-hidden="true">
                            <svg width="24" height="24">
                                <use xlink:href="#trash"></use>
                            </svg>
                        </span>
                    </button>
                </div>

                <div class="contact-us__form-rows product-cart-modal__form-rows">
                    {{#each modal.fields}}
                    <div class="contact-us__form-row feedback-modal__form-row product-cart-modal__form-row{{#if this.isFile}} contact-us__form-row--file{{/if}}">
                        {{#if this.isFile}}
                        <label class="contact-us__form-label contact-us__form-label--file" for="{{this.id}}">{{this.label}}</label>
                        {{else}}
                        <label class="contact-us__form-label" for="{{this.id}}">{{this.label}}</label>
                        {{/if}}

                        <div class="contact-us__form-control{{#if this.isFile}} contact-us__form-control--file js-file-field{{/if}}">
                            {{#if this.isFile}}
                            <input class="contact-us__form-file-input" id="{{this.id}}" name="{{this.name}}"
                                type="file" accept="{{this.accept}}">
                            <span class="contact-us__form-file-value contact-us__form-file-value--placeholder"
                                data-placeholder="{{this.placeholder}}">{{this.placeholder}}</span>
                            {{else}}
                            <input class="contact-us__form-input" id="{{this.id}}" name="{{this.name}}"
                                type="{{this.type}}" placeholder="{{this.placeholder}}"
                                {{#if this.autocomplete}}autocomplete="{{this.autocomplete}}"{{/if}}
                                {{#if this.required}}required{{/if}}>
                            {{/if}}
                        </div>
                    </div>
                    {{/each}}
                </div>

                <div class="contact-us__form-footer feedback-modal__form-footer product-cart-modal__form-footer">
                    <button class="btn contact-us__form-submit feedback-modal__form-submit" type="submit">
                        {{modal.submitText}}
                    </button>

                    <p class="contact-us__form-policy feedback-modal__form-policy">
                        {{{modal.policyText}}}
                        <a class="contact-us__form-policy-link" href="{{modal.policyLinkHref}}" target="_blank"
                            rel="noreferrer noopener">{{modal.policyLinkText}}</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
