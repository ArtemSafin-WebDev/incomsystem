<nav class="pagination{{#if pagination.className}} {{pagination.className}}{{/if}}" aria-label="{{pagination.ariaLabel}}">
    <ul class="pagination__list" data-scroll-reveal-ignore>
        {{#each pagination.items}}
        <li class="pagination__item">
            {{#if this.active}}
            <span class="pagination__link active" aria-current="page">{{this.label}}</span>
            {{else}}
            <a class="pagination__link" href="{{this.href}}" aria-label="{{this.ariaLabel}}">{{this.label}}</a>
            {{/if}}
        </li>
        {{/each}}
    </ul>
</nav>
