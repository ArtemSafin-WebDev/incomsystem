{{#if cookieBanner}}
<section class="cookie-banner js-cookie-banner" role="region" aria-label="{{cookieBanner.ariaLabel}}"
    data-storage-key="{{cookieBanner.storageKey}}" data-scroll-reveal-ignore>
    <button class="cookie-banner__close js-cookie-banner-close" type="button"
        aria-label="{{cookieBanner.closeAriaLabel}}">
        <svg width="24" height="24" aria-hidden="true">
            <use xlink:href="#cookie-close"></use>
        </svg>
    </button>

    <p class="cookie-banner__text">{{{cookieBanner.text}}}</p>

    <div class="cookie-banner__actions">
        <button class="cookie-banner__button cookie-banner__button--secondary js-cookie-banner-reject" type="button">
            {{cookieBanner.rejectText}}
        </button>
        <button class="cookie-banner__button cookie-banner__button--primary js-cookie-banner-accept" type="button">
            {{cookieBanner.acceptText}}
        </button>
    </div>
</section>
{{/if}}
