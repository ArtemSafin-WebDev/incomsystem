<a class="cooperation-card" href="{{item.href}}">
    <h2 class="cooperation-card__title">{{item.title}}</h2>

    <span class="cooperation-card__link">
        <span>{{detailsText}}</span>
        <svg width="16" height="16" aria-hidden="true">
            <use xlink:href="#arrows/details-chevron"></use>
        </svg>
    </span>

    <img class="cooperation-card__hover-image" src="{{item.hoverImage}}" alt="" loading="lazy">
</a>
