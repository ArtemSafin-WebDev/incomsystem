<section class="career-faq" aria-labelledby="career-faq-title">
    <div class="container">
        <h2 class="career-faq__title" id="career-faq-title">{{{careerFaq.title}}}</h2>

        <div class="career-faq__content">
            {{#if careerFaq.counterText}}
            <p class="career-faq__counter">{{careerFaq.counterText}}</p>
            {{/if}}

            <ul class="career-faq__list product-text-page__topics-list" aria-label="{{careerFaq.ariaLabel}}">
                {{#each careerFaq.items}}
                <li class="product-text-page__topics-item js-accordion{{#if isOpen}} active{{/if}}">
                    <button class="product-text-page__topics-button js-accordion-btn"
                        type="button"
                        id="{{id}}-button"
                        aria-expanded="{{#if isOpen}}true{{else}}false{{/if}}"
                        aria-controls="{{id}}-panel">
                        <span>{{{question}}}</span>
                        <span class="product-text-page__topics-icon" aria-hidden="true">
                            <svg width="15" height="9" aria-hidden="true">
                                <use xlink:href="#arrows/accordion-chevron"></use>
                            </svg>
                        </span>
                    </button>

                    <div class="product-text-page__topics-dropdown js-accordion-dropdown"
                        id="{{id}}-panel"
                        role="region"
                        aria-labelledby="{{id}}-button"
                        aria-hidden="{{#if isOpen}}false{{else}}true{{/if}}">
                        <div class="product-text-page__topics-dropdown-inner">
                            <div class="product-text-page__topics-content">
                                <p>{{{answer}}}</p>
                            </div>
                        </div>
                    </div>
                </li>
                {{/each}}
            </ul>
        </div>
    </div>
</section>
