<section class="not-found js-intro-bg">
    <div class="not-found__bg" aria-hidden="true">
        <picture>
            <source media="(max-width: 576px)" srcset="/images/hero/bg-mobile.webp">
            <img src="/images/hero/bg.webp" alt="">
        </picture>
        <video class="not-found__bg-video js-intro-bg-video" autoplay muted loop playsinline preload="none"
            poster="/images/hero/bg.webp">
            <source data-src="/videos/intro-bg.webm" type="video/webm">
            <source data-src="/videos/intro-bg.mp4" type="video/mp4">
        </video>
    </div>

    <div class="container">
        <div class="not-found__content">
            <div class="not-found__overlay" aria-hidden="true"></div>
            <div class="not-found__text">
                <h1 class="not-found__title">{{notFound.title}}</h1>
                <p class="not-found__description">{{notFound.description}}</p>
                <a class="btn not-found__link" href="{{notFound.linkHref}}">{{notFound.linkText}}</a>
            </div>
        </div>
    </div>
</section>
